<script>
  /* Mark JS early so reveal styles apply without a flash; play the entry curtain only on internal navigation. */
  (function (d) {
    d.documentElement.classList.add('js');
    try { if (sessionStorage.getItem('gcd-nav') === '1') { d.documentElement.classList.add('is-entering'); sessionStorage.removeItem('gcd-nav'); } } catch (e) {}
  })(document);
</script>
